<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GraytTrees Bonsai</title>
<meta name="description" content="Nathan's private bonsai collection records">
<meta name="theme-color" content="#2E5B5F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&display=swap">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 21v-6M12 15c-2 0-3-1.5-5-1.5S3 12 3 10.5 4.5 8 6.5 8C7 5.5 9 4 12 4s5 1.5 5.5 4c2 0 3.5 1 3.5 2.5S19 13.5 17 13.5 14 15 12 15z"/><path d="M7 21h10"/></symbol>
  <symbol id="i-season" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15h3"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
  <symbol id="i-pot" viewBox="0 0 24 24"><path d="M3 9h18l-2 9H5z"/><path d="M7 21h2M15 21h2"/><path d="M8 9c0-2 2-4 4-4s4 2 4 4"/></symbol>
  <symbol id="i-mix" viewBox="0 0 24 24"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7z"/><circle cx="9" cy="6" r="1.4"/><circle cx="14" cy="4.5" r="1.4"/><circle cx="16" cy="7.5" r="1.4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></symbol>
  <symbol id="i-roots" viewBox="0 0 24 24"><path d="M12 3v8M12 11c-3 2-5 4-6 9M12 11c3 2 5 4 6 9M12 11v9M9 15l-3 1M15 15l3 1"/></symbol>
  <symbol id="i-wire" viewBox="0 0 24 24"><path d="M4 20c2-2 2-5 4-6s4 1 5-1-1-4 1-5 4 0 6-4"/><path d="M6 17l2 1M9 13.5l1.5 1.6M13 12l1.3 1.6M15 8l1.6 1M18 5.5l1.4 1"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19l8-8"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></symbol>

  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-brush" viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H6v-6z"/><path d="M4 20l2-2"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h0"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></symbol>
</svg>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="seal" aria-hidden="true">GT</div>
    <button data-nav="trees"><svg class="ico"><use href="#i-tree"/></svg>Trees</button>
    <button data-nav="season"><svg class="ico"><use href="#i-season"/></svg>Season</button>
    <button data-nav="history"><svg class="ico"><use href="#i-history"/></svg>History</button>
    <button data-nav="pots"><svg class="ico"><use href="#i-pot"/></svg>Pots</button>
    <button data-nav="mixes"><svg class="ico"><use href="#i-mix"/></svg>Mixes</button>
    <button data-nav="past"><svg class="ico"><use href="#i-archive"/></svg>Past trees</button>
    <button data-nav="review"><svg class="ico"><use href="#i-question"/></svg>Review</button>
    <button class="rail-log" data-log><svg class="ico"><use href="#i-plus"/></svg>Log work</button>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" aria-label="Sections">
  <button data-nav="trees"><svg class="ico"><use href="#i-tree"/></svg>Trees</button>
  <button data-nav="season"><svg class="ico"><use href="#i-season"/></svg>Season</button>
  <button class="logbtn" data-log aria-label="Log work"><span class="disc"><svg class="ico"><use href="#i-plus"/></svg></span>Log</button>
  <button data-nav="history"><svg class="ico"><use href="#i-history"/></svg>History</button>
  <button data-nav="more"><svg class="ico"><use href="#i-more"/></svg>More</button>
</nav>
